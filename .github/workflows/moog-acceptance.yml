# The Minimoog voice's acceptance suite, in CI.
#
# `model/test_moog_acceptance.py` asks one question per claimed musical
# property -- does res = 1 still start the self-oscillation everywhere, does
# the stopband still fall at 24 dB/octave, does a high-resonance note still
# end -- with each claim cited to its decision record. Its last group injects
# the defects those records were written from and requires the matching
# property to go red, so a green run means the suite could have failed.
#
# `model/test_audio_measure.py` is the ground truth for every estimator the
# suite measures with. It runs first: an acceptance suite built on untested
# analysers measures the analysers.
name: moog acceptance

on:
  push:
    paths:
      - 'model/**'
      - 'audition/**'
      - 'spec/**'
      - '.github/workflows/moog-acceptance.yml'
  pull_request:
    paths:
      - 'model/**'
      - 'audition/**'
      - 'spec/**'
      - '.github/workflows/moog-acceptance.yml'
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy pytest
      - name: measurement ground truth
        run: python -m pytest model/test_audio_measure.py -q
      - name: acceptance properties, and the proof they can fail
        run: python -m pytest model/test_moog_acceptance.py -q
      - name: the rest of the model suite
        run: python -m pytest model spec -q
